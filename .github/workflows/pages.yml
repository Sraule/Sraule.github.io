name: Review-approved GitHub Pages release

# Manual only: committing or pushing this project never publishes it.
on:
  workflow_dispatch:
    inputs:
      content_approved:
        description: 'I reviewed the homepage, project images, personal information, and sharing permissions.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.content_approved == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Resolve GitHub Pages site and base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and audit public output
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed build
        id: deployment
        uses: actions/deploy-pages@v4

# Refresh workflow registration after enabling GitHub Actions.
